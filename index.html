<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dating Sim Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The Main Background (Revealed after intro) -->
  <div class="main-background">
    <div class="content-overlay">
      <!-- Future portfolio content will go here -->
      <h1>Welcome to the Game</h1>
      <p>Select your route...</p>
    </div>
  </div>

  <!-- The Intro Sequence Overlay -->
  <div class="intro-screen">
    
    <!-- Step 1: Loading Text -->
    <div class="loading-text">Loading...</div>
    
    <!-- Step 2: Rotating Circle & Step 3: Play Icon -->
    <div class="circle-container">
      <div class="rotating-circle"></div>
      
      <!-- The Triangle (Play Icon) -->
      <div class="play-icon"></div>
    </div>
    
  </div>

</body>
</html>
